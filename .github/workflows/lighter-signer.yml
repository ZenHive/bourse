name: Lighter signer

on:
  pull_request:
    paths:
      - "native/lighter_signer/**"
      - "lib/bourse/dispatch.ex"
      - "lib/bourse/signing/lighter.ex"
      - "lib/bourse/signing/lighter/**"
      - "lib/mix/tasks/ccxt.build_lighter_signer.ex"
      - "lib/mix/tasks/ccxt.check_lighter_signer.ex"
      - "test/bourse/signing/lighter_native_test.exs"
      - "mix.exs"
      - ".github/workflows/lighter-signer.yml"
  push:
    branches: [main]
    paths:
      - "native/lighter_signer/**"
      - "lib/bourse/dispatch.ex"
      - "lib/bourse/signing/lighter.ex"
      - "lib/bourse/signing/lighter/**"
      - "lib/mix/tasks/ccxt.build_lighter_signer.ex"
      - "lib/mix/tasks/ccxt.check_lighter_signer.ex"
      - "test/bourse/signing/lighter_native_test.exs"
      - "mix.exs"
      - ".github/workflows/lighter-signer.yml"

permissions:
  contents: read

jobs:
  # Dependabot watches the manifest, so a transitive dependency that drops out of
  # go.mod stops being reported even though the module graph still selects it —
  # which is what happened when go-ethereum 1.17 absorbed golang.org/x/crypto and
  # `go mod tidy` removed our direct requirement. Re-pinning cannot fix that: tidy
  # drops a requirement no package imports. govulncheck asks the question that
  # actually matters for a signing helper — is a vulnerable symbol reachable from
  # the code we build — so it keeps reporting whether or not the manifest does.
  vulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/lighter_signer/go.mod
          cache-dependency-path: native/lighter_signer/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
        working-directory: native/lighter_signer

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-2025
            target: windows-amd64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/lighter_signer/go.mod
          cache-dependency-path: native/lighter_signer/go.sum
      - run: mix deps.get
      - run: mix ccxt.build_lighter_signer --target ${{ matrix.target }}
      - run: go test ./...
        working-directory: native/lighter_signer
      - run: mix test.json --quiet --include native test/bourse/signing/lighter_native_test.exs
      - uses: actions/upload-artifact@v4
        with:
          name: lighter-signer-${{ matrix.target }}
          path: priv/native/lighter_signer/${{ matrix.target }}/
