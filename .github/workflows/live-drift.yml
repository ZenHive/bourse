name: Live provider drift

# The scheduled ten-venue drift lane runs from the always-on operator host
# (workbench task 527), where all ten venues are reachable — no unreachable
# allowlist. This GitHub-hosted job is a manual-only fallback; its allowlist
# below reflects GitHub-runner egress reality, not the canonical lane.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-provider-drift
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/lighter_signer/go.mod
          cache-dependency-path: native/lighter_signer/go.sum
      - run: mix deps.get
      - run: mix ccxt.build_lighter_signer --target linux-amd64
      - name: Verify live provider contracts
        run: mix ccxt.verify_live_drift --report artifacts/live-drift-report.json
        env:
          # GitHub-hosted runners egress from US IPs; the binance-family demo
          # hosts and bybit reject them (geo-block). Local/EU runs leave this
          # unset and verify all ten venues.
          LIVE_DRIFT_UNREACHABLE_OK: binance,binancecoinm,binanceusdm,bybit
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          BINANCE_FUTURES_TEST_API_KEY: ${{ secrets.BINANCE_FUTURES_TEST_API_KEY }}
          BINANCE_FUTURES_TEST_API_SECRET: ${{ secrets.BINANCE_FUTURES_TEST_API_SECRET }}
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
          BYBIT_DEMO_API_KEY: ${{ secrets.BYBIT_DEMO_API_KEY }}
          BYBIT_DEMO_API_SECRET: ${{ secrets.BYBIT_DEMO_API_SECRET }}
          DERIBIT_TESTNET_API_KEY: ${{ secrets.DERIBIT_TESTNET_API_KEY }}
          DERIBIT_TESTNET_API_SECRET: ${{ secrets.DERIBIT_TESTNET_API_SECRET }}
          DERIVE_TESTNET_API_KEY: ${{ secrets.DERIVE_TESTNET_API_KEY }}
          DERIVE_TESTNET_API_SECRET: ${{ secrets.DERIVE_TESTNET_API_SECRET }}
          HYPERLIQUID_TESTNET_API_KEY: ${{ secrets.HYPERLIQUID_TESTNET_API_KEY }}
          HYPERLIQUID_TESTNET_API_SECRET: ${{ secrets.HYPERLIQUID_TESTNET_API_SECRET }}
          LIGHTER_TESTNET_ACCOUNT_INDEX: ${{ secrets.LIGHTER_TESTNET_ACCOUNT_INDEX }}
          LIGHTER_TESTNET_API_KEY_INDEX: ${{ secrets.LIGHTER_TESTNET_API_KEY_INDEX }}
          LIGHTER_TESTNET_API_PRIVATE_KEY: ${{ secrets.LIGHTER_TESTNET_API_PRIVATE_KEY }}
          OKX_INTL_API_KEY: ${{ secrets.OKX_INTL_API_KEY }}
          OKX_INTL_API_SECRET: ${{ secrets.OKX_INTL_API_SECRET }}
          OKX_INTL_PASSPHRASE: ${{ secrets.OKX_INTL_PASSPHRASE }}
      - name: Publish durable run identity
        if: always()
        run: echo "Live drift run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload scrubbed drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-drift-${{ github.run_id }}
          path: artifacts/live-drift-report.json
