# The offline gate. Everything here runs without credentials, without network
# access to a venue, and without the Go/C toolchain — so it stays green on a
# public fork and on a fresh clone.
#
# Why this exists: until now the only workflows were integration.yml,
# live-drift.yml and lighter-signer.yml, none of which runs the offline suite or
# the static checks. Format, warnings-as-errors, Credo, Doctor, Sobelow,
# Dialyzer, deps.audit, the reality oracle and the package build were enforced
# solely by this host's PostToolUse hooks and by harness reviewers — which gates
# dispatched work, but leaves an outside pull request and a plain `git clone`
# with no gate at all.
#
# Split into two jobs because Dialyzer's PLT dominates a cold run; it caches on
# its own key so a source-only change does not rebuild it. The Go signer is
# deliberately absent — lighter-signer.yml owns that four-target matrix.
#
# Like the sibling workflows this is NOT a required status check: harness lands
# approved runs by ff-pushing straight to the target branch, and a required check
# would block those pushes.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Offline checks (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The pair this repo develops on — carries the full gate.
          - elixir: "1.20"
            otp: "29"
            primary: true
          # mix.exs declares `~> 1.18`, so the declared floor gets compiled and
          # tested here or the published minimum is a promise nothing verifies.
          # Elixir 1.18 supports OTP 25-27, so 27 is its ceiling. Only compile
          # and the suites run on this leg: format, Credo, Doctor, Sobelow and
          # the docs/lock checks are version-independent repo hygiene, and
          # running them twice buys nothing.
          - elixir: "1.18"
            otp: "27"
            primary: false
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Cache deps & _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      # Unused deps and a stale lock are cheap to catch and confusing to debug.
      - if: matrix.primary
        run: mix deps.unlock --check-unused

      - name: Format
        if: matrix.primary
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      # TODO(Task N) markers are first-class in this repo — see the `precommit`
      # alias in mix.exs, which passes the same flags.
      - name: Credo
        if: matrix.primary
        run: mix credo --strict --ignore TagTODO,TagFIXME

      - name: Doctor
        if: matrix.primary
        run: mix doctor --raise

      # Hash-based `.sobelow-skips`; this repo's tooling ignores inline comments.
      - name: Sobelow
        if: matrix.primary
        run: mix sobelow --skip

      # `--include package` builds and unpacks the real Hex tarball, which is the
      # only place Hex's recursive directory expansion is visible.
      - name: Offline suite
        run: mix test.json --quiet --exclude integration --include package

      # Binary reality gate over the recordings, accepted requests and recorded
      # errors. The committed exact-set baseline rejects lost provenance.
      - name: Reality oracle
        run: mix ccxt.oracle_gate

      # The trading domain may depend on the client, never the reverse — that is
      # what keeps a later extraction a file move rather than a refactor.
      - name: Domain boundary
        run: mix test.json --quiet test/bourse/domain_boundary_test.exs

      # CLAUDE.md's mechanical claims vs the tree, and AGENTS.md freshness. A
      # stale AGENTS.md makes a cross-family reviewer grade against rules that
      # have already changed.
      - name: Documentation claims
        if: matrix.primary
        run: |
          mix ccxt.claude_check
          mix ccxt.agents_md --check

      # mix.lock against the advisory database; `hex.audit` only catches retired
      # packages. The alias carries this repo's one documented ignore.
      - name: Dependency audit
        run: mix deps.audit

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - name: Cache deps & _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: dialyzer-mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            dialyzer-mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      # No separate PLT cache: dialyxir writes into `_build/dev`, which the cache
      # above already carries on a key that changes only with mix.lock or the
      # OTP/Elixir pair — exactly when the PLT would have to be rebuilt anyway.
      - run: mix deps.get
      - run: mix compile

      - name: Dialyzer
        run: mix dialyzer.json --quiet
