# Credential-free live-testnet integration suite.
#
# ~16 files under test/ carry the ExUnit `:integration` tag, but no existing
# workflow passes `--include integration` — they have never run in CI. This
# workflow runs the SUBSET that needs zero API credentials and does zero
# mutation, so it can go green in a public-fork-friendly, secret-free way and
# stay green. It does NOT need any repo secrets.
#
# Why only a subset (verified 2026-08-02, see the commit that added this file):
#
#   * Almost every "*_authored_integration_test.exs" file (bybit, binance,
#     okx, deribit, derive) plus binancecoinm_promotion / bybit_account_
#     analytics / hyperliquid_authored mixes public reads and
#     credential-gated private reads IN THE SAME MODULE with no tag that
#     distinguishes them. ExUnit's `--include` is OR-based per test (any
#     matching include tag forces a test to run REGARDLESS of what else is
#     in --exclude — confirmed by reading ex_unit's Filters.eval/4), so
#     `--exclude dangerous`/`--exclude private` cannot rescue a test that
#     also carries the file's shared `:integration` moduletag. Enabling
#     those files here would force their `require_credentials!()` calls to
#     flunk loudly with no secrets configured — a permanently-red job.
#   * alpaca_authored_integration_test.exs and lighter_signing_integration_test.exs
#     are entirely credential-gated (Alpaca has no anonymous market-data
#     endpoint at all).
#   * lighter_promotion_integration_test.exs has exactly one public test and
#     one `@tag :dangerous` + credentialed test in the same module — same
#     OR-semantics limitation as above, so it's excluded too.
#   * The generated per-exchange-per-auth-class probe suites
#     (raw_endpoint_probe_test.exs, unified_method_integration_test.exs)
#     have the identical problem one level up: `:public_dangerous` tests
#     carry BOTH `:public` and `:dangerous`, so `--include public` also
#     force-runs on-chain-broadcast writes. Smallest fix if this is ever
#     revisited: give `:public_dangerous`/`:private_dangerous` their own
#     non-overlapping tag instead of composing `:dangerous` + `:public`.
#   * test/bourse/integration_sandbox_gate_test.exs is credential-free and
#     tag-clean, but is currently RED against the ten-venue runtime cutover
#     (task 173) — it still expects `{:error, :no_testnet_data}` for an
#     unsupported exchange id and now gets `{:error, {:unsupported_exchange,
#     _}}`. Left out of this workflow until that's fixed (pre-existing bug,
#     unrelated to this workflow).
#
# What's enabled:
#
#   * option_surface_integration_test.exs — public option discovery + greeks
#     across deribit/okx/bybit/derive testnets/demos. No tags needed; the
#     whole file is public and non-mutating.
#   * public_read_round_trip_integration_test.exs — public fetch_markets/
#     fetch_ticker smoke test, restricted via `--include exchange_<venue>`
#     to deribit/derive/hyperliquid/lighter/okx. binance/binancecoinm/
#     binanceusdm/bybit are deliberately left out here even though they're
#     credential-free: live-drift.yml's own `LIVE_DRIFT_UNREACHABLE_OK`
#     documents that GitHub-hosted runners egress from US IPs that those
#     four venues' demo/testnet hosts geo-block. The alpaca-tagged test
#     (needs ALPACA_API_KEY/SECRET — Alpaca has no anonymous endpoint) and
#     the untagged "smoke inventory" test are excluded the same way.
#
# That residual risk landed: option_surface_integration_test.exs's bybit case
# hits api-testnet.bybit.com, which was assumed reachable where the demo host
# is not. It is not — both bybit tests failed from a GitHub runner on
# 2026-08-07 while passing from an EU host, i.e. the same geo-block class, not
# a code regression. The file's tests now carry per-venue `exchange_<venue>`
# tags and the job selects the reachable three.
#
# This job is deliberately NOT a required status check: harness lands
# approved runs by ff-pushing straight to `development`, and a required
# check would block those pushes.

name: Integration

on:
  schedule:
    - cron: "0 7 * * *" # nightly 07:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - name: Cache deps & _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get
      - run: mix compile

      # Every test in this file is public and non-mutating, so the only
      # filtering is per-venue reachability: bybit is selected out because
      # api-testnet.bybit.com geo-blocks the US IPs GitHub runners egress
      # from (observed 2026-08-07 — the same two tests pass from an EU host).
      # This is the failure the header comment predicted, not a regression.
      - name: Public option-surface probes (venues a GitHub runner can reach)
        run: |
          mix test.json --quiet \
            --include exchange_deribit \
            --include exchange_okx \
            --include exchange_derive \
            test/bourse/option_surface_integration_test.exs

      # Per-venue tag selection: pulls in only the credential-free,
      # non-geo-blocked venue cases from this file (see header comment for
      # why alpaca/binance*/bybit/the untagged smoke test are left out).
      - name: Public read round-trip (subset of venues)
        run: |
          mix test.json --quiet \
            --include exchange_deribit \
            --include exchange_derive \
            --include exchange_hyperliquid \
            --include exchange_lighter \
            --include exchange_okx \
            test/bourse/public_read_round_trip_integration_test.exs
